[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-temporal-vault"
version = "2.1.0"
description = "A locally-hosted MCP server implementing a two-tier storage system for long-horizon coding context"
authors = [
    { name = "Developer" }
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "zstandard>=0.22.0",
    "cryptography>=41.0.0",
]
readme = "README.md"
requires-python = ">= 3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_temporal_vault"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

